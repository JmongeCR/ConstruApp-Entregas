services:
  - type: web
    name: construapp-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: construapp-db
          property: connectionString
      - key: JwtSettings__SecretKey
        sync: false
      - key: Email__Password
        sync: false
      - key: Gemini__ApiKey
        sync: false
      - key: Groq__ApiKey
        sync: false

databases:
  - name: construapp-db
    plan: free
    databaseName: construappdb
    user: construapp
